<!DOCTYPE html>
<html>
<head>
    <title>Outpatient Appointment Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Outpatient Clinic Appointment Planner</h1>

        <form id="appointmentForm">
            <input id="patient" placeholder="Patient Name" required>
            <input id="age" type="number" placeholder="Age" min="0" required>

            <select id="gender" required>
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>

            <input id="phone" type="tel"
                   placeholder="Contact Number" required>

            <input id="doctor" placeholder="Doctor Name" required>

            <input id="department" placeholder="OP Department" required>

            <input id="date" type="date" required>
            <input id="time" type="time" required>

            <input id="reason" placeholder="Visit Reason" required>

            <button type="submit">Add Appointment</button>
        </form>

        <h2>Outpatient Appointment Details</h2>

        <input id="search" placeholder="Search patient name..."
               oninput="displayAppointments()">

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Patient</th>
                        <th>Age</th>
                        <th>Gender</th>
                        <th>Phone</th>
                        <th>Doctor</th>
                        <th>Department</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Reason</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="appointmentList"></tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
